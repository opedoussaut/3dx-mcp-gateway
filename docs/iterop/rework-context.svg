<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Rework context in claude-iterop-orchestrator</title>
  <desc id="d">Claude reads a task with iterop_get_task. The connector reads ITEROP first (the task's displayed data, then the run's variables when the account may read them) and fills the gaps from its own run record of what it wrote. It returns a runContext with start values, earlier stages, the engineer's sign-off and any gaps. The engineer signs in ITEROP Play; the connector never writes the sign-off.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1768a4"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0b6a6e"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#d9e3ea;stroke-width:1.2}
      .key{fill:#f0f6fb;stroke:#9cc2df;stroke-width:1.2}
      .safe{fill:#f3fafa;stroke:#a9d9da;stroke-width:1.2}
      .h{font-size:15px;font-weight:650;fill:#10283f}
      .s{font-size:12.5px;fill:#5b6b7a}
      .m{font-size:11px;font-weight:600;fill:#1768a4;letter-spacing:.06em}
      .new{font-size:11px;font-weight:600;fill:#0b6a6e;letter-spacing:.06em}
      .lab{font-size:11.5px;fill:#0b6a6e;font-weight:600}
      .col{font-size:12px;font-weight:700;fill:#5b6b7a;letter-spacing:.08em}
      .ln{stroke:#1768a4;stroke-width:1.6;fill:none}
      .lg{stroke:#0b6a6e;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1200" height="660" fill="#f5f8fa"/>

  <text x="24" y="40" class="col">CLAUDE</text>
  <text x="290" y="40" class="col">YOUR COMPUTER · THE CONNECTOR</text>
  <text x="830" y="40" class="col">SANDBOX TENANT</text>

  <rect x="24" y="80" width="230" height="110" rx="12" class="box"/>
  <text x="44" y="112" class="h">Claude</text>
  <text x="44" y="138" class="s">Reads each task with its run</text>
  <text x="44" y="158" class="s">context and plans the rework.</text>
  <text x="44" y="178" class="s">Asks you when a gap is named.</text>

  <rect x="290" y="56" width="500" height="364" rx="14" class="key"/>
  <text x="310" y="78" class="m">CLAUDE-ITEROP-ORCHESTRATOR · MCP STDIO</text>

  <rect x="320" y="94" width="440" height="116" rx="12" class="box"/>
  <text x="340" y="124" class="h">iterop_get_task</text>
  <text x="340" y="150" class="s">1. Reads ITEROP: the task's data, then the run if readable.</text>
  <text x="340" y="170" class="s">2. Fills the gaps from the connector's run record.</text>
  <text x="340" y="190" class="s">3. Labels every value iterop or connector; names the gaps.</text>

  <rect x="320" y="270" width="440" height="128" rx="12" class="safe"/>
  <text x="340" y="296" class="new">NEW</text>
  <text x="378" y="296" class="h">Run record</text>
  <text x="340" y="322" class="s">Start values and each stage the connector wrote.</text>
  <text x="340" y="342" class="s">A completed rework updates the start values; pass + 1.</text>
  <text x="340" y="362" class="s">Live: .private/iterop-runs.json, last 50 runs,</text>
  <text x="340" y="382" class="s">so context survives a restart of Claude.</text>

  <rect x="830" y="94" width="340" height="116" rx="12" class="box"/>
  <text x="850" y="124" class="h">ITEROP</text>
  <text x="850" y="150" class="s">Task data: what its form displays</text>
  <text x="850" y="170" class="s">Run variables: getInstanceInfo</text>
  <text x="850" y="190" class="s">(often 403 for a run-only account)</text>

  <rect x="830" y="270" width="340" height="128" rx="12" class="box"/>
  <text x="850" y="300" class="h">Engineer in ITEROP Play</text>
  <text x="850" y="326" class="s">Approve, or Reject with a comment.</text>
  <text x="850" y="346" class="s">The decision reaches Claude only</text>
  <text x="850" y="366" class="s">through ITEROP: the connector never</text>
  <text x="850" y="386" class="s">writes or invents the sign-off.</text>

  <path d="M256 140H318" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M828 150H762" class="ln" marker-end="url(#a)"/>
  <path d="M540 268V212" class="ln" marker-end="url(#a)"/>
  <path d="M1000 268V212" class="ln" marker-end="url(#a)"/>

  <path d="M139 192V334H318" class="lg" marker-end="url(#g)"/>
  <text x="150" y="262" class="lab">start, complete task</text>
  <path d="M790 240H880V212" class="lg" marker-end="url(#g)"/>
  <text x="800" y="232" class="lab">writes</text>

  <path d="M540 420V452" class="ln" marker-end="url(#a)"/>
  <rect x="24" y="456" width="1146" height="160" rx="14" class="box"/>
  <text x="44" y="484" class="col">RUNCONTEXT · RETURNED TO CLAUDE WITH EACH TASK</text>
  <rect x="44" y="500" width="262" height="96" rx="10" class="key"/>
  <text x="62" y="528" class="h">Start values</text>
  <text x="62" y="552" class="s">The envelope of the run;</text>
  <text x="62" y="572" class="s">after a rework, the revised one.</text>
  <rect x="326" y="500" width="262" height="96" rx="10" class="key"/>
  <text x="344" y="528" class="h">Earlier stages</text>
  <text x="344" y="552" class="s">Each stage's outputs; the rejected</text>
  <text x="344" y="572" class="s">pass is marked fromEarlierPass.</text>
  <rect x="608" y="500" width="262" height="96" rx="10" class="key"/>
  <text x="626" y="528" class="h">Sign-off</text>
  <text x="626" y="552" class="s">Decision and comment, read</text>
  <text x="626" y="572" class="s">from ITEROP only.</text>
  <rect x="890" y="500" width="262" height="96" rx="10" class="key"/>
  <text x="908" y="528" class="h">Gaps</text>
  <text x="908" y="552" class="s">What could not be read.</text>
  <text x="908" y="572" class="s">Claude asks; it never guesses.</text>

  <text x="24" y="642" class="s">Solid: reads. Dashed: writes. Teal: new in this change.</text>
</svg>
